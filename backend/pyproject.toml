[project]
name = "core-api"
version = "0.1.0"
description = "CORE API backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "httpx>=0.27,<0.28",
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary==2.9.10",
    "python-dotenv>=1.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "firebase-admin>=6.6,<7.0",
]

[tool.vercel]
entrypoint = "src.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
